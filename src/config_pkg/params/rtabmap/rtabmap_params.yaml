rtabmap:
  ros__parameters:
    Grid/CellSize: "0.05"
    Grid/MaxGroundAngle: "30"
    Grid/MinClusterSize: "30"
    Grid/Sensor: "2"
    Grid/RangeMin: "0.3"
    Grid/RangeMax: "8.0" 
    Grid/MaxObstacleHeight: "1.0"
    Grid/RayTracing: "true"
    Grid/Scan2dUnknownSpaceFilled: "true"
    Grid/NormalsSegmentation: "false"
    Reg/Force3DoF: "true"
    Reg/Strategy: "0"
    LccIcp/Type: "0"
    LccIcp2/MaxCorrespondenceDistance: "0.5"   # was too small, increase significantly
    LccIcp2/VoxelSize: "0.0"                   # disable voxel filtering — arena is sparse
    LccIcp2/MaxIteration: "30"
    LccIcp2/Epsilon: "0.001"
    LccIcp2/MaxTranslation: "1.0"
    LccIcp2/MaxRotation: "0.5"
    LccIcp2/CorrespondenceRatio: "0.2"         # only need 20% point overlap to accept
    IcpOdometry/Strategy: "1"
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityByTime: "true"
    RGBD/ProximityAngle: "90"
    RGBD/ProximityDistance: "1.5"
    RGBD/ProximityPathMaxNeighbors: "100"
    RGBD/LoopClosure: "true"
    RGBD/LoopClosureMaxDistance: "15.0"
    RGBD/LoopClosureReextractFeatures: "true"
    RGBD/MaxLoopClosureDistance: "1.0"
    RGBD/NewMapOdomChangeDistance: "20.0"
    RGBD/OdomVarianceGuess: "false"
    RGBD/OdomCorrection: "true"
    RGBD/ProximityOdomGuess: "false"
    RGBD/OptimizeMaxError: "0.0"
    RGBD/NeighborLinkRefining: "true"
    RGBD/OptimizeFromGraphEnd: "false"
    RGBD/StartAtOrigin: "true"
    RGBD/LinearUpdate: "0.05"   # was 0.1 — create keyframes every 5cm instead of 10cm
    RGBD/AngularUpdate: "0.05"
    RGBD/LinearSpeedUpdate: "0.02"
    RGBD/AngularSpeedUpdate: "0.002"
    RGBD/CreateOccupancyGrid: "true"
    RGBD/MarkerDetection: "false"
    Marker/Dictionary: "20"
    Marker/Length: "0.1651"
    Rtabmap/StartNewMapOnGoodSignature: "false"
    Rtabmap/DetectionRate: "15"
    Rtabmap/OdomGuessRatio: "0.0"
    Mem/IncrementalMemory: "true"
    Mem/STMSize: "40"
    Mem/MaxCacheSize: "50000"
    Rtabmap/DatabaseInMemory: "true"
    Rtabmap/Threads: "8"
    Vis/Odom: "false"
    Vis/MinInliers: "15"
    Vis/EstimationType: "0"
    Optimizer/Strategy: "2"
    Optimizer/Iterations: "20" 
    Optimizer/Epsilon: "0.00001"
    Optimizer/Robust: "true"         # use robust kernel instead — handles outliers gracefully
    Optimizer/RobustKernelFactor: "0.1"
    Odom/Strategy: "0"
    Odom/FilteringStrategy: "1"
    Odom/KalmanProcessNoise: "0.01"
    Odom/KalmanMeasurementNoise: "0.1"
    Odom/GuessSmoothingDelay: "0.3"
    "tf_delay": 0.0,
    "tf_tolerance": 0.3,